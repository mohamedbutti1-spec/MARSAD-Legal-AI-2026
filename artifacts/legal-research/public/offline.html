<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>لا يوجد اتصال — مرصد MARSAD</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #080B12;
        color: #E7E2D6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
        gap: 16px;
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #0B1018;
        border: 1px solid rgba(184, 154, 91, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg { width: 36px; height: 36px; }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
        color: #E7E2D6;
      }
      p {
        font-size: 14px;
        color: rgba(231, 226, 214, 0.6);
        margin: 0;
        max-width: 320px;
        line-height: 1.7;
      }
      button {
        margin-top: 8px;
        padding: 10px 24px;
        border-radius: 8px;
        border: 1px solid rgba(184, 154, 91, 0.4);
        background: rgba(184, 154, 91, 0.12);
        color: #B89A5B;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      button:active { opacity: 0.75; }
      .brand {
        margin-top: 24px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(231, 226, 214, 0.35);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" fill="#B89A5B"/>
        </svg>
      </div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر الوصول إلى منصة مرصد حالياً. تحقّق من اتصالك بالشبكة ثم أعد المحاولة.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
      <div class="brand">MARSAD</div>
    </div>
  </body>
</html>

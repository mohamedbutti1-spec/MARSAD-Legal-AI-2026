kind = "web"
previewPath = "/"
title = "Legal Research Platform"
version = "1.0.0"
id = "artifacts/legal-research"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23979

[services.development]
run = "pnpm --filter @workspace/legal-research run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legal-research", "run", "build" ]
serve = "static"
publicDir = "artifacts/legal-research/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23979"
BASE_PATH = "/"

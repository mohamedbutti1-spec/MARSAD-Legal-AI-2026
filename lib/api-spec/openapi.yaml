openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Legal Research Platform API with AI capabilities
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: documents
    description: Document management
  - name: ai
    description: AI-powered features
  - name: users
    description: User management and permissions
  - name: citations
    description: Citation generation
  - name: comparisons
    description: Manual comparison tables
  - name: comments
    description: Document comments
  - name: settings
    description: Admin settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List all documents
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: uploadedBy
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"

  /documents/stats:
    get:
      operationId: getDocumentStats
      tags: [documents]
      summary: Get document statistics
      responses:
        "200":
          description: Document statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStats"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a single document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/search:
    post:
      operationId: aiSearch
      tags: [ai]
      summary: AI-powered smart search within documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSearchInput"
      responses:
        "200":
          description: AI search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSearchResult"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/literature-review:
    post:
      operationId: generateLiteratureReview
      tags: [ai]
      summary: Generate a literature review from selected documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiteratureReviewInput"
      responses:
        "200":
          description: Generated literature review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiteratureReviewResult"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/uae-france-compare:
    post:
      operationId: uaeFranceCompare
      tags: [ai]
      summary: AI legal comparison between UAE and France law
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalCompareInput"
      responses:
        "200":
          description: Legal comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCompareResult"
        "503":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /citations:
    post:
      operationId: generateCitation
      tags: [citations]
      summary: Generate a Harvard citation for a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitationInput"
      responses:
        "200":
          description: Generated citation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitationResult"

  /comparisons:
    get:
      operationId: listComparisons
      tags: [comparisons]
      summary: List manual comparison tables
      responses:
        "200":
          description: List of comparisons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comparison"
    post:
      operationId: createComparison
      tags: [comparisons]
      summary: Create a new comparison table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"

  /comparisons/{id}:
    get:
      operationId: getComparison
      tags: [comparisons]
      summary: Get a comparison table
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comparison table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateComparison
      tags: [comparisons]
      summary: Update a comparison table
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonUpdate"
      responses:
        "200":
          description: Updated comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comparison"
    delete:
      operationId: deleteComparison
      tags: [comparisons]
      summary: Delete a comparison table
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a document
      parameters:
        - name: documentId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment to a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /comments/{id}:
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user's name, email, role, or active status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get admin settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update admin settings (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /export:
    post:
      operationId: exportData
      tags: [documents]
      summary: Export documents or comparisons to Excel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportInput"
      responses:
        "200":
          description: Export job info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResult"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    Document:
      type: object
      required: [id, filename, fileType, fileSize, uploadedAt]
      properties:
        id:
          type: integer
        filename:
          type: string
        originalName:
          type: string
        fileType:
          type: string
        fileSize:
          type: integer
        content:
          type: ["string", "null"]
        keywords:
          type: ["string", "null"]
        uploadedById:
          type: ["integer", "null"]
        uploadedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DocumentStats:
      type: object
      required: [total, byType, totalSize, recentUploads]
      properties:
        total:
          type: integer
        byType:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type:
                type: string
              count:
                type: integer
        totalSize:
          type: integer
        recentUploads:
          type: integer

    AiSearchInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
        documentIds:
          type: array
          items:
            type: integer
        maxResults:
          type: integer

    AiSearchResult:
      type: object
      required: [query, results, summary]
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchHit"
        summary:
          type: string

    SearchHit:
      type: object
      required: [documentId, filename, excerpt, relevance]
      properties:
        documentId:
          type: integer
        filename:
          type: string
        excerpt:
          type: string
        relevance:
          type: number

    LiteratureReviewInput:
      type: object
      required: [topic]
      properties:
        documentIds:
          type: array
          items:
            type: integer
          default: []
        legalSourceIds:
          type: array
          items:
            type: integer
          default: []
          description: IDs from the legal_sources table to include alongside uploaded documents
        topic:
          type: string
        language:
          type: string

    LiteratureReviewResult:
      type: object
      required: [topic, review, sources]
      properties:
        topic:
          type: string
        review:
          type: string
        sources:
          type: array
          items:
            type: string
        generatedAt:
          type: string
          format: date-time

    LegalCompareInput:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
        documentIds:
          type: array
          items:
            type: integer
        aspects:
          type: array
          items:
            type: string

    LegalCompareResult:
      type: object
      required: [topic, uaeAnalysis, franceAnalysis, similarities, differences, conclusion]
      properties:
        topic:
          type: string
        uaeAnalysis:
          type: string
        franceAnalysis:
          type: string
        similarities:
          type: array
          items:
            type: string
        differences:
          type: array
          items:
            type: string
        conclusion:
          type: string
        generatedAt:
          type: string
          format: date-time

    CitationInput:
      type: object
      required: [documentId]
      properties:
        documentId:
          type: integer
        authorName:
          type: ["string", "null"]
        publicationYear:
          type: ["integer", "null"]
        publisher:
          type: ["string", "null"]
        url:
          type: ["string", "null"]

    CitationResult:
      type: object
      required: [citation, format]
      properties:
        citation:
          type: string
        format:
          type: string

    Comparison:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        rows:
          type: ["string", "null"]
        createdById:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ComparisonInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        rows:
          type: string
        createdById:
          type: integer

    ComparisonUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        rows:
          type: string

    Comment:
      type: object
      required: [id, documentId, content, createdAt]
      properties:
        id:
          type: integer
        documentId:
          type: integer
        authorId:
          type: ["integer", "null"]
        authorName:
          type: ["string", "null"]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required: [documentId, content]
      properties:
        documentId:
          type: integer
        authorId:
          type: integer
        content:
          type: string
          minLength: 1

    User:
      type: object
      required: [id, name, email, role, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, supervisor, viewer]
        isActive:
          type: boolean
        lastActiveAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        role:
          type: string
          enum: [owner, supervisor, viewer]

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
        role:
          type: string
          enum: [owner, supervisor, viewer]
        isActive:
          type: boolean

    Settings:
      type: object
      required: [id, aiEnabled, maxUploadSizeMb, allowedFileTypes, updatedAt]
      properties:
        id:
          type: integer
        aiEnabled:
          type: boolean
        maxUploadSizeMb:
          type: integer
        allowedFileTypes:
          type: string
        maintenanceMode:
          type: boolean
        updatedAt:
          type: string
          format: date-time

    SettingsUpdate:
      type: object
      properties:
        aiEnabled:
          type: boolean
        maxUploadSizeMb:
          type: integer
        allowedFileTypes:
          type: string
        maintenanceMode:
          type: boolean

    ExportInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [documents, comparisons, all]
        documentIds:
          type: array
          items:
            type: integer
        comparisonIds:
          type: array
          items:
            type: integer

    ExportResult:
      type: object
      required: [downloadUrl, filename]
      properties:
        downloadUrl:
          type: string
        filename:
          type: string
        generatedAt:
          type: string
          format: date-time

name: Update crime scene card title

on:
  push:
    branches:
      - release/v1.0
    paths:
      - .github/workflows/update-crime-scene-title.yml

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0
          fetch-depth: 0

      - name: Replace only the requested title
        shell: python
        run: |
          from pathlib import Path

          path = Path("artifacts/legal-research/src/lib/journey-catalog.ts")
          text = path.read_text(encoding="utf-8")
          old = "id: 'before-travel', nameAr: 'قبل الانتقال',"
          new = "id: 'before-travel', nameAr: 'قائمة التحقق قبل الانتقال',"

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one target occurrence, found {count}")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          workflow = Path(".github/workflows/update-crime-scene-title.yml")
          workflow.unlink()

      - name: Commit the requested one-line change and remove temporary workflow
        run: |
          git config user.name "MARSAD Automation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/legal-research/src/lib/journey-catalog.ts .github/workflows/update-crime-scene-title.yml
          git commit -m "Rename crime-scene pre-travel checklist card"
          git push origin release/v1.0
